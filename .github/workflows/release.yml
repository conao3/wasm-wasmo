name: release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump the version and pack every package without pushing the tag or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_FILES: >-
    VERSION
    Cargo.toml
    Cargo.lock
    js/package.json
    js/package-lock.json
    jvm/pom.xml
    dotnet/src/Wasmo/Wasmo.csproj
    python/pyproject.toml
    ruby/wasmo.gemspec
    ruby/Gemfile.lock
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Bump version and pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch the release workflow from $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/version.sh check
          current=$(scripts/version.sh get)
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION $current is not X.Y.Z."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          for tag in "v$version" "go/v$version"; do
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
            if [[ "$existing" != 0 ]]; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v32.0.0
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > VERSION
          nix develop --command make version
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra files <<< "$VERSION_FILES"
          git commit -m "release: v$VERSION" -- "${files[@]}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::The version bump changed files outside VERSION_FILES."
            exit 1
          fi
      - run: nix develop --command make dist
      - run: cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Bundle the version commit
        run: git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          retention-days: 1

  tag:
    name: Push commit and tag
    needs: [check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}
      - name: Push commit and tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          if [[ "$(git rev-parse "$commit^")" != "$GITHUB_SHA" ]]; then
            echo "::error::The version commit is not a child of $GITHUB_SHA."
            exit 1
          fi
          read -ra allowed <<< "$VERSION_FILES"
          while read -r file; do
            if [[ " ${allowed[*]} " != *" $file "* ]]; then
              echo "::error::The version commit changes $file."
              exit 1
            fi
          done < <(git diff --name-only "$GITHUB_SHA" "$commit")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "wasmo v$VERSION" "$commit"
          git push --atomic origin "$commit:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

  npm:
    name: Publish to npm
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@conao3/wasmo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish "dist/js/conao3-wasmo-$VERSION.tgz" --access public --provenance
        env:
          VERSION: ${{ needs.check.outputs.version }}

  pypi:
    name: Publish to PyPI
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/wasmo/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/python/

  rubygems:
    name: Publish to RubyGems
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: rubygems
      url: https://rubygems.org/gems/wasmo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: "3.3"
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem push "dist/ruby/wasmo-$VERSION.gem"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  nuget:
    name: Publish to NuGet
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Wasmo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.x
      - id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "dist/dotnet/Wasmo.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  maven:
    name: Publish to Maven Central
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.conao3/wasmo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: cachix/install-nix-action@v32.0.0
      - run: |
          cat > "$RUNNER_TEMP/settings.xml" << 'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
      - run: |
          nix develop --command make wasm
          cd jvm
          nix develop .. --command mvn -B -P release -DskipTests -s "$RUNNER_TEMP/settings.xml" verify
          for f in "wasmo-$VERSION.jar" "wasmo-$VERSION-sources.jar" "wasmo-$VERSION-javadoc.jar"; do
            cmp "target/$f" "../dist/jvm/$f"
          done
          nix develop .. --command mvn -B -P release -DskipTests -s "$RUNNER_TEMP/settings.xml" deploy
        env:
          WASMO_WASM: dist/wasmo.wasm
          VERSION: ${{ needs.check.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  go:
    name: Push the Go module tag
    needs: [check, npm, pypi, rubygems, nuget, maven]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
      - run: scripts/version.sh check "v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go/go.mod
          cache: false
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/go-release.sh dist/wasmo.wasm --push
      - run: |
          cd "$(mktemp -d)"
          go mod init example.com/warm
          GOPROXY=https://proxy.golang.org go list -m "github.com/conao3/wasm-wasmo/go@v$VERSION"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  github-release:
    name: Create GitHub Release
    needs: [check, go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "wasmo $VERSION" --generate-notes \
            dist/wasmo.wasm dist/SHA256SUMS dist/*/*
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
