[workspace]
resolver = "3"
members = ["crates/wasmo-core", "crates/wasmo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/conao3/wasm-wasmo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
base64 = "0.23"
quick-xml = "0.38"
md-5 = "0.11"
sha2 = "0.11"
sha1 = "0.11"
crc = "3"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"] }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "sha2"] }
hmac = "0.13"
rand_core = { version = "0.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex-lite = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
